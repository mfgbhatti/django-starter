{% extends "base.html" %}
{% block title %}Home — Django Starter{% endblock %}
{% block content %}
    <h1>Django Starter</h1>
    <p>Signed in as <strong>{{ user.email }}</strong>.</p>
    <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="btn" type="submit">Log out</button>
    </form>
{% endblock %}
